        .rate-input { background: transparent; color: var(--text-primary); font-weight: 700; font-size: 1.3rem; font-family: "Avenir Next", "SF Pro Display", sans-serif; border-bottom: 1px solid rgba(72,72,70,0.14); padding: 0; width: 100%; text-align: center; line-height: 32px; height: 32px; transition: border-color 0.2s; }

        .hero-title {

                x: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>,

                thumbsUp: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>,

        });

        const RateInput = ({ label, val, onChange, isEditing, setIsEditing }) => {
            const [buffer, setBuffer] = useState(val);
            useEffect(() => { if (!isEditing) setBuffer(val); }, [val, isEditing]);
            const handleFocus = (e) => { setIsEditing(true); setBuffer(val ? parseFloat(val).toString() : ''); setTimeout(() => e.target.select(), 0); };
            return (
                <div className="flex flex-col items-center justify-center w-full">
                    {label && <span className="text-[9px] font-bold text-[#757573] tracking-[0.24em] mb-0.5 whitespace-nowrap">{label}</span>}
                    <div className="rate-input-container w-full"><input type="number" inputMode="decimal" value={isEditing ? buffer : (val && !isNaN(parseFloat(val)) ? parseFloat(val).toFixed(5).replace(/\.?0+$/, '') : '')} onFocus={handleFocus} onBlur={()=>{setIsEditing(false);onChange(buffer===''? '':buffer)}} onChange={(e)=>setBuffer(e.target.value)} placeholder="--" className="rate-input"/></div>
                </div>
            );
        };

        const GeneralModeHeader = memo(({ settings, rates, customRates, handleCustomRate, editingMap, setEditingMap, isInverseRate, setIsInverseRate }) => {
            const base = customRates.krw ? parseFloat(customRates.krw) : rates.krw;
            const displayBase = base; const displayInverse = base && base > 0 ? (1/base) : 0;
            
            const formatRate = (val) => {
                if (!val || isNaN(val)) return '';
                return parseFloat(val.toFixed(6)); 
            };

            return (
                <div className="rate-panel-grid mb-1">
                    <div className="rate-panel-cell rate-panel-cell--split">

                <div className={`space-y-4 animate-fade-in ${useMathKeypad && activeField ? 'pb-[28rem]' : 'pb-2'}`}>
                    {renderDutyFreeField('tagPrice', COPY.dutyFreeOriginalLabel)}
                    <div className="flex gap-3 mb-2 overflow-x-auto no-scrollbar px-1">{COPY.dutyFreeDiscounts.map(d => (<button key={d} onClick={() => applyDiscount(d)} className="flex-1 py-2.5 rounded-full bg-[rgba(201,166,161,0.12)] text-[#7B6661] text-xs font-bold border border-[rgba(201,166,161,0.18)] hover:bg-[rgba(201,166,161,0.18)] active:scale-95">{COPY.discountFold(d)}</button>))}</div>
                    <div
                        ref={(node) => { fieldRefs.current.payVal = node; }}
                        className="app-card relative scroll-mt-24 p-5"
                    >
                        <label className="text-[9px] font-bold text-[#8FA39D] uppercase tracking-[0.28em] block mb-2">{COPY.dutyFreePaidLabel}</label>
                        <div className="flex items-center min-h-[4.2rem]">
                            <span className="text-2xl font-bold text-[#B6B8B3] mr-2 self-center">$</span>
                            <div className="flex-1 relative">
                                {activeField === 'payVal' && hasExpressionOperators(dfInput.payVal) && !isNaN(evaluateMathExpression(dfInput.payVal)) ? (
                                    <>
                                        {useMathKeypad ? (
                                            <button
                                                type="button"
                                                onClick={() => setActiveField('payVal')}
                                                className="absolute top-0 right-0 flex w-full justify-end bg-transparent pr-12 text-right text-[1rem] font-medium text-[#A7A8A2] tracking-[-0.02em]"
                                            >
                                                <span>{dfInput.payVal}</span>
                                                <span className="math-inline-caret" />
                                            </button>
                                        ) : (
                                            <input
                                                type="text"
                                                inputMode="text"
                                                placeholder="0"
                                                value={dfInput.payVal}
                                                onFocus={() => setActiveField('payVal')}
                                                onChange={(e)=>setDfInput({...dfInput, payVal: e.target.value})}
                                                onBlur={() => commitDutyFreeField('payVal', 'decimal2')}
                                                onKeyDown={(e) => handleDutyFreeKeyDown(e, 'payVal', 'decimal2')}
                                                className="absolute top-0 right-0 w-full bg-transparent pr-12 text-right text-[1rem] font-medium text-[#A7A8A2] placeholder-[#D6D7D2] tracking-[-0.02em]"
                                            />
                                        )}
                                        <div className="pr-12 pt-5 text-right text-[3rem] font-black leading-none tracking-tight text-[#2E2E2E]">
                                            {getPreviewNumberText(dfInput.payVal, 'decimal2', evaluateMathExpression)}
                                        </div>
                                    </>
                                ) : (
                                    useMathKeypad ? (
                                        <button
                                            type="button"
                                            onClick={() => setActiveField('payVal')}
                                            className="flex w-full justify-end bg-transparent pr-12 text-right text-[3rem] font-black tracking-tight text-[#2E2E2E]"
                                        >
                                            <span className={dfInput.payVal ? '' : 'text-[#D6D7D2]'}>{dfInput.payVal || '0'}</span>
                                            {activeField === 'payVal' && <span className="math-inline-caret" />}
                                        </button>
                                    ) : (
                                        <input
                                            type="text"
                                            inputMode="text"
                                            placeholder="0"
                                            value={dfInput.payVal}
                                            onFocus={() => setActiveField('payVal')}
                                            onChange={(e)=>setDfInput({...dfInput, payVal: e.target.value})}
                                            onBlur={() => commitDutyFreeField('payVal', 'decimal2')}
                                            onKeyDown={(e) => handleDutyFreeKeyDown(e, 'payVal', 'decimal2')}
                                            className="w-full bg-transparent pr-12 text-[3rem] font-black tracking-tight text-[#2E2E2E] placeholder-[#D6D7D2]"
                                        />
                                    )
                                )}
                                {dfInput.payVal && <button onClick={()=>setDfInput({...dfInput, payVal: ''})} className="absolute right-1 top-1/2 z-10 -translate-y-1/2 rounded-full border border-white/50 bg-[rgba(255,255,255,0.76)] p-2 text-[#B6B8B3] shadow-[inset_0_1px_0_rgba(255,255,255,0.92)]"><Icon name="x" size={16}/></button>}
                            </div>
                        </div>
                        <div className="flex justify-between items-center mt-4 bg-[rgba(255,255,255,0.46)] p-2.5 rounded-[1.1rem] border border-white/50">
                            <span className="text-xs font-bold text-[#484846] flex items-center gap-1">{COPY.dutyFreeInstantRatePrefix} {instantTwd.toLocaleString()} <span className="text-[10px] bg-[rgba(214,192,179,0.18)] text-[#757573] px-1.5 rounded-full">{COPY.dutyFreeRateLabel} {instantRate.toFixed(2)}</span></span>
                            {status && <div className={`text-[9px] px-2.5 py-1 rounded-full font-bold flex items-center gap-1 ${status.isSafe ? 'bg-[rgba(143,163,157,0.16)] text-[#6F827D]' : 'bg-[rgba(176,114,107,0.12)] text-[#B0726B]'}`}><Icon name={status.isSafe ? 'check' : 'alert'} size={10}/> {status.text}</div>}
                        </div>
                    </div>
                    <div className="app-card p-4 bg-[rgba(214,192,179,0.12)] border-[rgba(214,192,179,0.24)]">
                        <div className="flex justify-between items-center mb-3"><label className="text-xs font-bold text-[#6E5F57] pl-1">{COPY.dutyFreeRebateLabel}</label><div className="flex items-center bg-[rgba(255,255,255,0.76)] px-3 py-1.5 rounded-[1.1rem] border border-white/50 shadow-sm"><input type="number" min="0" max="40" step="0.5" value={settings.dutyFreeRebate} onChange={(e)=>{updateSetting('dutyFreeRebate',e.target.value);}} className="w-12 text-lg font-black text-[#6E5F57] text-right bg-transparent outline-none"/><span className="text-sm text-[#B6B8B3] font-bold ml-1">%</span></div></div>
                        <div className="flex items-center gap-3"><button onClick={()=>adjustRebate(-0.5)} className="w-8 h-8 rounded-full bg-[rgba(255,255,255,0.76)] border border-white/50 text-[#6E5F57] flex items-center justify-center shadow-sm active:scale-90"><Icon name="minus" size={14}/></button><div className="flex-1 relative h-6 flex items-center"><input type="range" min="0" max="40" step="0.5" value={settings.dutyFreeRebate} onChange={(e)=>{updateSetting('dutyFreeRebate',e.target.value);}} className="w-full h-2 bg-gradient-to-r from-[rgba(214,192,179,0.45)] to-[rgba(201,166,161,0.72)] rounded-full appearance-none cursor-pointer accent-[#C9A6A1]"/></div><button onClick={()=>adjustRebate(0.5)} className="w-8 h-8 rounded-full bg-[rgba(255,255,255,0.76)] border border-white/50 text-[#6E5F57] flex items-center justify-center shadow-sm active:scale-90"><Icon name="plus" size={14}/></button></div>
                    </div>
                    <MathKeypad
                        visible={useMathKeypad && !!activeField}
                        onInsert={(token) => appendDutyFreeToken(activeField, token)}
                        onBackspace={() => backspaceDutyFreeToken(activeField)}
                        onClear={() => setDfInput({ ...dfInput, [activeField]: '' })}
                        onDone={() => commitDutyFreeField(activeField, 'decimal2')}
                    />
                </div>
            );
        });

        const App = () => {
            const [settings, setSettings] = useState(DEFAULT_SETTINGS);
            const [allStrategies, setAllStrategies] = useState(() => {
                try {
                    const s = safeGetStorage(STRATEGY_STORAGE_KEY);
                    return upgradeStrategiesMap(s ? JSON.parse(s) : DEFAULT_STRATEGIES_MAP);
                } catch {
                    return upgradeStrategiesMap(DEFAULT_STRATEGIES_MAP);
                }
            });
            const [showStrategySettings, setShowStrategySettings] = useState(false);
            const [showSettings, setShowSettings] = useState(false);
            const [isInverseRate, setIsInverseRate] = useState(true);
            const [editingMap, setEditingMap] = useState({}); 
            const saveTimeoutRef = useRef(null);
            const {
                customRates,
                lastUpdated,
                isRefreshing,
                fetchRates,
                handleCustomRate,
                effectiveRates
            } = useRateManager({
                COPY,
                safeGetStorage,
                safeSetStorage,
                RATE_STORAGE_KEY,
                CUSTOM_RATES_STORAGE_KEY,
                RATE_CACHE_TTL,
                AUTO_REFRESH_INTERVAL,
                fetchExchangeRates,
                normalizeRates
            });

            // Separate State for Memory Function
            const [genInput, setGenInput] = useState({ val: '', type: 'target' });
            const [dfInput, setDfInput] = useState({ payVal: '', tagPrice: '' });
            // NEW: State to track which card is being edited in Strategy Settings
            const [editingStrategyCardId, setEditingStrategyCardId] = useState(null);

            useEffect(() => { safeSetStorage(STRATEGY_STORAGE_KEY, JSON.stringify(allStrategies)); }, [allStrategies]);
            
            // NEW: Get strategies for the card currently being edited, or active if none specified (though modal logic ensures ID is set)
            const currentStrategies = useMemo(() => {
                const targetId = editingStrategyCardId || settings.activePresetId;
                return allStrategies[targetId] || [];
            }, [allStrategies, editingStrategyCardId, settings.activePresetId]);

            // NEW: Update strategies for the specific card being edited
            const setCurrentStrategies = useCallback((newS) => { 
                const targetId = editingStrategyCardId || settings.activePresetId;
                setAllStrategies(prev => ({ 
                    ...prev, 
                    [targetId]: typeof newS === 'function' ? newS(prev[targetId]||[]) : newS 
                })); 
            }, [editingStrategyCardId, settings.activePresetId]);

            // NEW: Handler to open settings for a specific card
            const handleOpenStrategySettings = useCallback((cardId) => {
                setEditingStrategyCardId(cardId);
                setShowStrategySettings(true);
            }, []);

            // NEW: Close handler to reset editing ID
            const handleCloseStrategySettings = useCallback(() => {
                setShowStrategySettings(false);
                setEditingStrategyCardId(null);
            }, []);

            useEffect(() => {
                const s = safeGetStorage(STORAGE_KEY);
                if (s) {
                    try {
                        setSettings(prev => ({ ...prev, ...JSON.parse(s) }));
                    } catch {}
                }
            }, []);

            const debouncedSave = useCallback((ns) => { clearTimeout(saveTimeoutRef.current); saveTimeoutRef.current = setTimeout(() => safeSetStorage(STORAGE_KEY, JSON.stringify(ns)), 800); }, []);
            const updateSetting = useCallback((k, v) => setSettings(p => { const n = { ...p, [k]: v }; debouncedSave(n); return n; }), [debouncedSave]);
            const updatePreset = useCallback((id, f, v) => setSettings(p => { const np = p.cardPresets.map(c => c.id===id ? { ...c, [f]: v } : c); const n = { ...p, cardPresets: np }; debouncedSave(n); return n; }), [debouncedSave]);
            const applyPreset = useCallback((c) => setSettings(p => { const n = { ...p, activePresetId: c.id, cardType: c.type, reward: c.reward, rewardType: c.rewardType, isMobilePay: c.isMobilePay||false, isBankAccount: c.isBankAccount||false }; debouncedSave(n); return n; }), [debouncedSave]);
            const calcResult = useMemo(() => buildCalcResult({ settings, genInput, dfInput, effectiveRates, allStrategies }), [genInput, dfInput, settings, effectiveRates, allStrategies]);

            const refundMethodComparison = useMemo(() => {
                if (settings.mode !== 'general' || settings.taxMode === 'off' || !genInput.val) return null;
                const airportResult = buildCalcResult({ settings: { ...settings, refundMethod: 'airport' }, genInput, dfInput, effectiveRates, allStrategies });
                const immediateResult = buildCalcResult({ settings: { ...settings, refundMethod: 'immediate' }, genInput, dfInput, effectiveRates, allStrategies });
                if (!airportResult?.finalCost || !immediateResult?.finalCost) return null;
                const betterMethod = airportResult.finalCost <= immediateResult.finalCost ? 'airport' : 'immediate';
                return {
                    available: true,
                    selectedMethod: settings.refundMethod,
                    betterMethod,
                    difference: Math.abs(airportResult.finalCost - immediateResult.finalCost),
                    airportFinalCost: airportResult.finalCost,
                    immediateFinalCost: immediateResult.finalCost
                };
            }, [settings, genInput, dfInput, effectiveRates, allStrategies]);

            const advice = useMemo(() => buildAdvice(settings, calcResult), [settings, calcResult]);
            
            const handleModeSwitch = (m) => {
                if (m === 'dutyfree' && settings.mode === 'general' && genInput.val) {
                    const usdVal = convertGeneralInputToDutyFreeTagPrice(genInput, effectiveRates);
                    if (usdVal) setDfInput(prev => ({ ...prev, tagPrice: usdVal }));
                }
                updateSetting('mode', m); 
            };

            return (
                    <div className="ios-shell h-full min-h-[100dvh] w-full flex flex-col relative overflow-hidden border-x border-white/40">
                    {showSettings && <CardSettings settings={settings} updatePreset={updatePreset} updateSetting={updateSetting} onClose={()=>setShowSettings(false)} openStrategySettings={handleOpenStrategySettings} />}
                    {showStrategySettings && <StrategySettings strategies={currentStrategies} setStrategies={setCurrentStrategies} onClose={handleCloseStrategySettings} rates={effectiveRates} settings={settings} cardName={settings.cardPresets.find(c => c.id === editingStrategyCardId)?.name || COPY.unknownCard} />}
                    
                    <header className={`flex-none px-4 pt-safe pb-8 shadow-[0_10px_40px_rgba(94,96,90,0.08)] z-20 transition-all duration-700 border-b border-white/30 ${settings.mode==='dutyfree'?'header-dutyfree':'header-general'}`}>
                        <div className="flex justify-between items-center gap-3 mb-3 pt-3">
                            <div className="min-w-0 flex-1">
                                <div className="header-brand">
                                    <div className="brand-mark"><div className="brand-symbol"><Icon name="shoppingBag" size={17}/></div></div>
                                    <div className="min-w-0">
                                        <h1 className="hero-title">購黑皮</h1>
                                        <p className="hero-subtitle mt-1">{COPY.appSubtitle}</p>
                                    </div>
                                </div>
                            </div>
                            <div className="flex items-center gap-2 shrink-0">
                                <button onClick={()=>window.open('https://creatrip.com/exchange', '_blank', 'noopener,noreferrer')} className="tool-button tool-button--iconOnly text-[#484846]" aria-label="查詢當地現鈔匯率"><Icon name="search"/></button>
                                <button onClick={()=>setShowSettings(true)} className="tool-button text-[#484846]" aria-label="設定"><Icon name="settings"/></button>
                                <button onClick={fetchRates} className={`tool-button tool-button--muted text-[#484846] ${isRefreshing?'text-[#B0726B]':''}`} aria-label="更新匯率"><Icon name="refresh" className={isRefreshing?'spin-anim':''}/><span className="text-[10px] font-bold tracking-[0.18em] uppercase">Rate</span></button>
                            </div>
                        </div>
                        <div className="soft-panel flex items-center gap-2 mb-2 p-1.5 rounded-[1.45rem] w-full overflow-hidden">
                             <div className="flex shrink-0 border-r border-[rgba(182,184,179,0.32)] pr-2 mr-1"><button onClick={()=>handleModeSwitch('general')} className={`px-3.5 py-2 rounded-full text-[10px] font-bold tracking-[0.18em] transition-all ${settings.mode==='general'?'bg-[rgba(255,255,255,0.82)] text-[#2E2E2E] shadow-sm':'text-[#757573] hover:text-[#2E2E2E]'}`}>{COPY.modeButtons.general}</button><button onClick={()=>handleModeSwitch('dutyfree')} className={`px-3.5 py-2 rounded-full text-[10px] font-bold tracking-[0.18em] transition-all ${settings.mode==='dutyfree'?'bg-[rgba(255,255,255,0.82)] text-[#2E2E2E] shadow-sm':'text-[#757573] hover:text-[#2E2E2E]'}`}>{COPY.modeButtons.dutyfree}</button></div>
                             <div className="flex overflow-x-auto no-scrollbar gap-1.5 flex-1 mask-linear items-center">{settings.cardPresets.filter(c=>c.enabled!==false).map(c => (<button key={c.id} onClick={()=>applyPreset(c)} className={`whitespace-nowrap px-3.5 py-2 rounded-full text-[10px] font-bold transition-all flex items-center gap-1.5 ${settings.activePresetId===c.id ? 'bg-[rgba(201,166,161,0.16)] text-[#2E2E2E] border border-[rgba(201,166,161,0.18)] shadow-sm' : 'text-[#757573] bg-[rgba(255,255,255,0.34)] border border-transparent hover:text-[#2E2E2E]'}`}>{c.isMobilePay && <Icon name="mobile" size={9} className="opacity-60"/>} {c.name}</button>))}</div>
                        </div>
                        <div className="soft-panel mt-2 rounded-[1.55rem] p-3">
                            {settings.mode === 'dutyfree' ? <DutyFreeModeHeader rates={effectiveRates} customRates={customRates} handleCustomRate={handleCustomRate} editingMap={editingMap} setEditingMap={setEditingMap} /> : <GeneralModeHeader settings={settings} rates={effectiveRates} customRates={customRates} handleCustomRate={handleCustomRate} editingMap={editingMap} setEditingMap={setEditingMap} isInverseRate={isInverseRate} setIsInverseRate={setIsInverseRate} />}
                            <div className="flex justify-between items-center text-[9px] text-[#757573] px-1 mt-1"><span className="flex items-center gap-1 opacity-80"><Icon name="refresh" size={8}/> {COPY.rateFooterPrefix} {effectiveRates.krw.toFixed(5)} {COPY.rateFooterSuffix}</span><span className="flex items-center gap-1 opacity-80">{lastUpdated}</span></div>
                        </div>
                    </header>
                    <main className="flex-1 min-h-0 rounded-t-[2.6rem] -mt-5 bg-[rgba(236,237,234,0.88)] px-5 pt-5 overflow-y-auto no-scrollbar pb-safe relative z-30 border-t border-white/70 shadow-[0_-18px_45px_-20px_rgba(94,96,90,0.18)] backdrop-blur-sm">
                        <div className="sticky top-0 z-40 h-7 w-full bg-gradient-to-b from-[rgba(236,237,234,0.98)] to-transparent pointer-events-none -mt-3 mb-3"></div>
                        {settings.mode === 'general' ? <GeneralMode settings={settings} genInput={genInput} setGenInput={setGenInput} calcResult={calcResult} updateSetting={updateSetting} advice={advice} rates={effectiveRates} refundMethodComparison={refundMethodComparison}/> : <DutyFreeMode settings={settings} dfInput={dfInput} setDfInput={setDfInput} updateSetting={updateSetting} calcResult={calcResult} rates={effectiveRates}/>}
                        <BreakdownPanel calcResult={calcResult} settings={settings} rates={effectiveRates} inputVal={settings.mode==='general'?genInput.val:dfInput.payVal} campaignData={calcResult.campaignData} />
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
                    .then((reg) => {
                        const requestUpdate = () => reg.update().catch((e) => console.warn('[SW] update check failed', e));
                        requestUpdate();
                        document.addEventListener('visibilitychange', () => {
                            if (document.visibilityState === 'visible') requestUpdate();
                        });
                        if (navigator.serviceWorker.controller) {
                            navigator.serviceWorker.addEventListener('controllerchange', () => {
                                window.location.reload();
                            }, { once: true });
                        }
                    })
                    .catch((e) => console.warn('[SW] registration failed', e));
            });
        }
    </script>
</body>
</html>
